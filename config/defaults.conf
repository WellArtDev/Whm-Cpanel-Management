# WhmCpanel Management v9 defaults
WCP_VERSION="9.2.0"
WCP_APP_NAME="WhmCpanel Management"
WCP_STATE_DIR="/root/whmcpanel"
WCP_LOG_DIR="$WCP_STATE_DIR/logs"
WCP_REPORT_DIR="$WCP_STATE_DIR/reports"
WCP_BACKUP_DIR="$WCP_STATE_DIR/backups"
WCP_CACHE_DIR="$WCP_STATE_DIR/cache"
WCP_CONFIG_DIR="$WCP_STATE_DIR/config"
WCP_PLUGIN_DIR="${WCP_PLUGIN_DIR:-/usr/local/whmcpanel/plugins}"

# Safety defaults
WCP_DRY_RUN="${WCP_DRY_RUN:-0}"
WCP_ASSUME_YES="${WCP_ASSUME_YES:-0}"
WCP_API_TIMEOUT="${WCP_API_TIMEOUT:-30}"
WCP_CMD_TIMEOUT="${WCP_CMD_TIMEOUT:-120}"
WCP_DISK_WARN="${WCP_DISK_WARN:-80}"
WCP_DISK_CRIT="${WCP_DISK_CRIT:-90}"
WCP_INODE_WARN="${WCP_INODE_WARN:-80}"
WCP_INODE_CRIT="${WCP_INODE_CRIT:-90}"
WCP_SSL_WARN_DAYS="${WCP_SSL_WARN_DAYS:-30}"
WCP_SSL_CRIT_DAYS="${WCP_SSL_CRIT_DAYS:-7}"

# Remote SSH defaults
WCP_SSH_CONFIG_DIR="$WCP_CONFIG_DIR/ssh"
WCP_SSH_SERVERS_FILE="$WCP_SSH_CONFIG_DIR/servers.conf"
WCP_SSH_PORT="${WCP_SSH_PORT:-22}"
WCP_SSH_CONNECT_TIMEOUT="${WCP_SSH_CONNECT_TIMEOUT:-10}"
WCP_SSH_COMMAND_TIMEOUT="${WCP_SSH_COMMAND_TIMEOUT:-120}"
WCP_SSH_KEEPALIVE="${WCP_SSH_KEEPALIVE:-30}"
WCP_SSH_KEEPALIVE_COUNT="${WCP_SSH_KEEPALIVE_COUNT:-3}"
WCP_SSH_HOSTKEY_POLICY="${WCP_SSH_HOSTKEY_POLICY:-accept-new}"
